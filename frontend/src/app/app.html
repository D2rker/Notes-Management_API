<div class="app-padding-wrapper">
<div ngTabs>
  <div ngTabList selectionMode="follow">
    <div ngTab value="write" [attr.aria-selected]="activeTab === 'write' ? 'true' : 'false'" (click)="setActiveTab('write')">Write Notes</div>
    <div ngTab value="list" [attr.aria-selected]="activeTab === 'list' ? 'true' : 'false'" (click)="setActiveTab('list')">Show all Notes</div>
  </div>
  <div class="sliding-window">
    <div ngTabPanel value="write">
      <app-makenotes (noteCreated)="onNoteCreated()"></app-makenotes>
    </div>
    <div ngTabPanel value="list">
      <app-getnotes [notes]="notes" (notesChanged)="loadNotes()"></app-getnotes>
    </div>
  </div>
</div>
