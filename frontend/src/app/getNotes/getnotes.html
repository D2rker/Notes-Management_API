<div class="notes-management-container">
  <h2>All Notes</h2>
  
  <div class="empty-state" *ngIf="notes.length === 0">
    <p>No notes to display yet. Create your first note!</p>
  </div>

  <div class="notes-grid" *ngIf="notes.length > 0">
    <div class="note-card" *ngFor="let n of notes">
      <!-- View Mode -->
      <ng-container *ngIf="editingNoteId !== (n.id || n._id)">
        <div class="note-header">
          <h3 class="note-title">{{ n.title }}</h3>
          <div class="note-actions">
            <button class="btn-edit" (click)="startEdit(n)" title="Edit">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
            <button class="btn-delete" (click)="deleteNote(n.id || n._id)" title="Delete">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            </button>
          </div>
        </div>
        <p class="note-content">{{ n.content }}</p>
        <p class="note-date">Created: {{ n.createdAt | date:'medium' }}</p>
      </ng-container>

      <!-- Edit Mode -->
      <ng-container *ngIf="editingNoteId === (n.id || n._id)">
        <div class="note-header">
          <input type="text" class="edit-input" [(ngModel)]="editNoteData.title" placeholder="Note Title">
          <div class="note-actions">
            <button class="btn-save" (click)="saveEdit()">Save</button>
            <button class="btn-cancel" (click)="cancelEdit()">Cancel</button>
          </div>
        </div>
        <textarea class="edit-textarea" rows="4" [(ngModel)]="editNoteData.content" placeholder="Note Content"></textarea>
      </ng-container>
    </div>
  </div>
</div>
